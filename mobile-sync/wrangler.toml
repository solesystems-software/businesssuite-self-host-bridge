name = "businesssuite-mobile-sync-dev"
main = "src/mobileSyncWorkerEntry.ts"
compatibility_date = "2026-07-08"
workers_dev = true
preview_urls = false

[vars]
SERVICE_ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "businesssuite-mobile-sync-dev"
database_id = "03f790dd-bfc9-4c1a-9e2c-c7c106a3bf0d"

[[r2_buckets]]
binding = "PAYLOADS"
bucket_name = "businesssuite-mobile-sync-dev"

[[durable_objects.bindings]]
name = "ACCOUNT_SYNC_CHANNEL"
class_name = "AccountSyncChannel"

[[migrations]]
tag = "v1-account-sync-channel"
# SQLite-backed DO namespace (required on the free plan; the channel keeps no
# durable state either way).
new_sqlite_classes = ["AccountSyncChannel"]

# Cloudflare_Self_Hosting_Wave4_Provisioning_Task_Spec_20260928.md Wave 4A (businesssuite_iteration
# repo; this file lives in the sibling businesssuite-mobile_iteration repo). Production naming --
# this same, unmodified wrangler.toml is what every self-hosted customer account deploys via
# `wrangler deploy --env production`. Deployed into `self-host-bridge` Production, this is a
# clone/deploy-flow validation rehearsal only, never live traffic -- every self-hosted customer's
# own account is the only place this actually serves traffic (design doc, corrected 2026-09-28).
[env.production]
name = "businesssuite-mobile-sync"

[env.production.vars]
SERVICE_ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "businesssuite-mobile-sync"
# This is self-host-bridge's validation-rehearsal database (see comment block above). A real
# self-hosted customer deploy creates and fills in its own id for its own account.
database_id = "94fa6ae6-18f8-44f0-bd80-7e79ce039d4f"

[[env.production.r2_buckets]]
binding = "PAYLOADS"
bucket_name = "businesssuite-mobile-sync"

[[env.production.durable_objects.bindings]]
name = "ACCOUNT_SYNC_CHANNEL"
class_name = "AccountSyncChannel"
