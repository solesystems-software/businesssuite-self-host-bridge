name = "businesssuite-mobile-sync-dev"
main = "src/mobileSyncWorkerEntry.ts"
compatibility_date = "2026-07-08"
workers_dev = true
preview_urls = false

[vars]
SERVICE_ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "businesssuite-mobile-sync-dev"
database_id = "03f790dd-bfc9-4c1a-9e2c-c7c106a3bf0d"

[[r2_buckets]]
binding = "PAYLOADS"
bucket_name = "businesssuite-mobile-sync-dev"

[[durable_objects.bindings]]
name = "ACCOUNT_SYNC_CHANNEL"
class_name = "AccountSyncChannel"

[[migrations]]
tag = "v1-account-sync-channel"
# SQLite-backed DO namespace (required on the free plan; the channel keeps no
# durable state either way).
new_sqlite_classes = ["AccountSyncChannel"]

# Production naming. `wrangler deploy --env production` deploys `businesssuite-mobile-sync`. This is the same,
# unmodified file every self-hosted customer deploys from, so it carries NO account-specific ids: the Deploy Now installer
# (businesssuite_iteration: src/main/services/selfHosting/SelfHostingDeployService.ts) looks up or creates the D1
# database and R2 bucket named below in the customer's own Cloudflare account, applies the migrations, and deploys with a
# copy of this file that has the real database id filled in. Deploying by hand: create the database
# (`npx wrangler d1 create businesssuite-mobile-sync`) and bucket, put the printed id in place of the placeholder below,
# and do not commit it.
[env.production]
name = "businesssuite-mobile-sync"

[env.production.vars]
SERVICE_ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "businesssuite-mobile-sync"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"

[[env.production.r2_buckets]]
binding = "PAYLOADS"
bucket_name = "businesssuite-mobile-sync"

[[env.production.durable_objects.bindings]]
name = "ACCOUNT_SYNC_CHANNEL"
class_name = "AccountSyncChannel"

# Durable Object migrations are declared per environment as well, so the production Worker gets its AccountSyncChannel
# class on first deploy.
[[env.production.migrations]]
tag = "v1-account-sync-channel"
new_sqlite_classes = ["AccountSyncChannel"]
