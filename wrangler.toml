name = "businesssuite-client-portal-dev"
main = "src/clientPortalWorkerEntry.ts"
compatibility_date = "2026-08-22"
workers_dev = true
preview_urls = false

# Client Portal is independent of licensing and of every other Worker (Galen, 2026-09-30): no licensing URL, no
# license key, no service binding. Requests are authenticated by this Worker's own self-bootstrapped publish signing
# secret (client_portal_worker_settings in schema.sql, see getOrCreatePublishSigningSecretBase64 in
# clientPortalRequestAuthentication.ts) -- it is not a Worker secret and must not become one.

[vars]
SERVICE_ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "businesssuite-client-portal-dev"
database_id = "53bd2b73-63e6-4a9c-b4f3-db6a39cdc68b"

[[r2_buckets]]
binding = "FILES"
bucket_name = "businesssuite-client-portal-files-dev"

# Part B Phase 7: daily retention/cleanup sweep (03:00 UTC), same routine POST /business/run-cleanup
# triggers manually for testing -- see clientPortalCleanup.ts.
[triggers]
crons = ["0 3 * * *"]

# Production naming. `wrangler deploy --env production` deploys `businesssuite-client-portal`. This file is the same,
# unmodified file every self-hosted customer deploys from (design doc, Resolved Decisions #4), so it carries NO
# account-specific ids: the Deploy Now installer (src/main/services/selfHosting/SelfHostingDeployService.ts) looks up or
# creates the D1 database and R2 bucket named below in the customer's own Cloudflare account, applies schema.sql,
# and deploys with a copy of this file that has the real database id filled in. Deploying by hand: create the database
# (`npx wrangler d1 create businesssuite-client-portal`) and the bucket, then put the printed id in place of the
# placeholder below -- but do not commit a real id.
[env.production]
name = "businesssuite-client-portal"

[env.production.vars]
SERVICE_ENVIRONMENT = "production"

# Environments do not inherit [triggers]; without this the production Worker never runs its daily cleanup.
[env.production.triggers]
crons = ["0 3 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "businesssuite-client-portal"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "businesssuite-client-portal-files"
